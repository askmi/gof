name: Build

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            example/go.mod

      - name: Build library
        run: go build ./...

      - name: Test library
        run: go test ./...

      - name: Build example
        working-directory: example
        run: go build ./...

      - name: Test example
        working-directory: example
        run: go test ./...
